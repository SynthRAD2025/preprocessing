services:
  synthrad:
    build:
      context: .
    volumes:
      # path to data directory
      # - /project_data_2/cbct/autoseg/data/:/data_full
      - /train_data/athummerer/autoseg/:/data_full
      # path to pre-processing code
      - ../:/code
    command: tail -F anything
    shm_size: '2gb'
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 'all'
            capabilities: [gpu]
